services:
  app: 
    image: mcr.microsoft.com/devcontainers/typescript-node:24
    volumes:
      - ..:/workspace
    working_dir: /workspace
    command: sleep infinity
    environment:
      POSTGRES_PASSWORD: postgres
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: postgres