---
name: Build container image
on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  IMAGE_DESC: "A bot that checks for new releases of GitHub repositories and posts them to messaging platforms like Discord and Telegram."
  IMAGE_KEYWORDS: "discord,github,messaging,release"

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        packages:
          - package: "@release-bot/bot-discord"
            image: "release-bot-discord"

    steps:
      - name: lowercase image name
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.packages.image }}
        run: echo "IMAGE_NAME=ghcr.io/${OWNER,,}/${NAME,,}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6

      - name: Image Metadata
        uses: docker/metadata-action@v6
        id: metadata
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Dockerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ github.ref_name }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=MIT
            io.artifacthub.package.prerelease=false

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PACKAGE_NAME=${{ matrix.packages.package }}
